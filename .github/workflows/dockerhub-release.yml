name: Docker Hub Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_NAMESPACE || 'aram07' }}/${{ vars.DOCKERHUB_REPOSITORY || 'machsense-api' }}
  MODEL_VERSION: ai4i-base1

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install training dependencies
        run: python -m pip install -r requirements.txt

      - name: Run production test gate
        run: python -m pytest -q

      - name: Check Docker Hub release configuration
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'aram07' }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'machsense-api' }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ] || [ -z "$DOCKERHUB_NAMESPACE" ] || [ -z "$DOCKERHUB_REPOSITORY" ]; then
            echo "Docker Hub release settings are not configured. Skipping publish step."
            echo "Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as GitHub secrets, and DOCKERHUB_NAMESPACE/DOCKERHUB_REPOSITORY as repo variables."
            exit 0
          fi
          echo "Docker Hub release configuration is present. Publish will proceed."

      - name: Ensure AI4I dataset is available
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          if [ ! -f data/ai4i2020.csv ]; then
            echo "data/ai4i2020.csv not found locally; downloading from UCI..."
            curl -L --fail --retry 3 -o data/ai4i2020.csv \
              "https://archive.ics.uci.edu/ml/machine-learning-databases/00691/ai4i2020.csv"
          fi
          test -f data/ai4i2020.csv
          ls -l data/ai4i2020.csv

      - name: Build versioned model bundle
        env:
          DATA_PATH: data/ai4i2020.csv
          MODEL_VERSION: ${{ env.MODEL_VERSION }}
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: python -c "from src.model_training import train_model; train_model('${DATA_PATH}')"

      - name: Calculate delivery checksum
        id: artifact
        shell: bash
        run: |
          checksum="$(sha256sum artifacts/models/${MODEL_VERSION}/model.joblib | cut -d' ' -f1)"
          echo "sha256=${checksum}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' && vars.DOCKERHUB_NAMESPACE != '' && vars.DOCKERHUB_REPOSITORY != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate immutable image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          load: true
          push: false
          tags: machsense-ai:ci
          build-args: |
            MODEL_ARTIFACT_SHA256=${{ steps.artifact.outputs.sha256 }}
            MODEL_VERSION=${{ env.MODEL_VERSION }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate container startup and prediction
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d --name machsense-ai-ci -p 18000:8000 machsense-ai:ci
          cleanup() { docker rm -f machsense-ai-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18000/ready
          curl --fail --silent --request POST http://127.0.0.1:18000/predict \
            --header 'Content-Type: application/json' \
            --data '{"Type":"M","Air temperature [K]":298.1,"Process temperature [K]":308.6,"Rotational speed [rpm]":1551,"Torque [Nm]":42.8,"Tool wear [min]":0}'

      - name: Push immutable image to Docker Hub
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' && vars.DOCKERHUB_NAMESPACE != '' && vars.DOCKERHUB_REPOSITORY != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            MODEL_ARTIFACT_SHA256=${{ steps.artifact.outputs.sha256 }}
            MODEL_VERSION=${{ env.MODEL_VERSION }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record pushed image reference
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          echo "Published immutable image tags:"
          echo "${{ steps.metadata.outputs.tags }}"
          echo "Model version: ${MODEL_VERSION}"
          echo "Model artifact SHA-256: ${{ steps.artifact.outputs.sha256 }}"